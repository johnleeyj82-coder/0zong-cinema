# 안드로이드 APK 자동 빌드
# 이 브랜치나 main에 올리면 APK를 만들어 Releases에 올려요. (Actions 탭에서 수동 실행도 돼요)
# TMDB 키는 저장소 Settings > Secrets and variables > Actions 에 TMDB_KEY 로 넣어 두면 앱에 들어가요.
name: Android APK

on:
  push:
    branches: [main, feat/marathon-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web and sync to Android
        env:
          VITE_TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: npm run cap:sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../0zong-cinema.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 0zong-cinema-apk
          path: 0zong-cinema.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 0zong Cinema APK ${{ github.run_number }}
          prerelease: true
          body: 휴대폰에서 아래 0zong-cinema.apk 를 눌러 받고 설치하세요. (처음 한 번 "출처를 알 수 없는 앱 설치" 허용 필요)
          files: 0zong-cinema.apk
